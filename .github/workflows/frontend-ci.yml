name: Frontend CI

on:
  push:
    branches:
      - main
      - "phase/**"
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend:
    name: Lint, typecheck, build, and preview smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Lint
        run: npm run lint

      - name: Architecture verification
        run: npm run verify:architecture

      - name: Refresh dependency lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Show dependency remediation diff
        run: git diff -- package.json package-lock.json

      - name: Upload refreshed dependency files
        uses: actions/upload-artifact@v7
        with:
          name: audited-dependency-files
          path: |
            package.json
            package-lock.json

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit regenerated dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref != ''
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore(deps): refresh audited dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Typecheck
        run: npx --yes -p typescript@5.9.3 tsc -p tsconfig.ci.json --noEmit

      - name: Build
        run: npm run build

      - name: Preview smoke test
        run: node scripts/smoke-preview.mjs
