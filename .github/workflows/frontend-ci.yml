name: Frontend CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 4 parser diagnostics
        run: |
          files=(
            src/core/api/apiClient.ts
            src/services/problemService.ts
            src/services/companyService.ts
            src/features/problems/redux/problemSlice.ts
            src/features/companies/redux/companySlice.ts
            src/features/references/redux/referenceSlice.ts
            src/features/problems/pages/PracticePage.tsx
            src/features/problems/pages/ProblemDetails.tsx
            src/features/companies/pages/CompanyDetails.tsx
          )
          for file in "${files[@]}"; do
            echo "===== $file ====="
            npx oxlint "$file" || true
          done

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
